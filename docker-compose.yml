version: '3.8'

services:
  sipbar-db:
    image: postgres:16-alpine
    container_name: sipbar-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sipbarpassword123
      POSTGRES_DB: sipbardb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sipbar-network

  sipbar-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sipbar-web
    restart: always
    depends_on:
      - sipbar-db
    environment:
      - DATABASE_URL=postgresql://postgres:sipbarpassword123@sipbar-db:5432/sipbardb?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=rahasia_super_aman_jwt_bps_jeneponto_2026_xyz_secret
      - NODE_ENV=production
    ports:
      - "3000:3000"
    networks:
      - sipbar-network

volumes:
  postgres_data:
    driver: local

networks:
  sipbar-network:
    driver: bridge
