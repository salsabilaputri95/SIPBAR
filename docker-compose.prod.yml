services:
  # -------------------------------------------------------------
  # PostgreSQL 16 Alpine Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sipbar_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sipbardb}
      TZ: Asia/Makassar
    ports:
      - "5433:5432"
    volumes:
      - sipbar_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sipbardb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sipbar_prod_network

  # -------------------------------------------------------------
  # Next.js 14 App Router Fullstack Web Application
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sipbar_prod_app
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sipbardb}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-sipbar-bps-jeneponto-secret-key-2026-secure}
      NODE_ENV: production
      TZ: Asia/Makassar
    ports:
      - "${APP_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sipbar_prod_network

volumes:
  sipbar_prod_pgdata:
    name: sipbar_prod_pgdata

networks:
  sipbar_prod_network:
    name: sipbar_prod_network
    driver: bridge
